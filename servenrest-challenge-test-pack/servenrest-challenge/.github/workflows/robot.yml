name: Robot API
on:
  push:
    paths: [ 'tests/**', 'resources/**' ]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: robot -d reports tests
      - uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: reports
